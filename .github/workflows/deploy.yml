name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment per ref; cancel superseded runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PAGES_PROJECT: autodockit

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export)
        run: npm run build

      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — build did not export"; exit 1; }
          test -f out/404.html   || echo "::warning::out/404.html missing"

      - name: Fail early if Cloudflare secrets are missing
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID secret is not set in this repository."
            exit 1
          fi

      # Create the Pages project on first run. Harmless (and ignored) if it
      # already exists — this is what prevents the "project not found" deploy
      # failure on a brand-new Cloudflare Pages setup.
      - name: Ensure Pages project exists
        if: github.ref == 'refs/heads/main'
        run: |
          npx --yes wrangler@3 pages project create "$PAGES_PROJECT" \
            --production-branch=main \
          || echo "Project '$PAGES_PROJECT' already exists or could not be created here — continuing."

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@3 pages deploy out \
            --project-name="$PAGES_PROJECT" \
            --branch="${{ github.head_ref || github.ref_name }}" \
            --commit-dirty=true
